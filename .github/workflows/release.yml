# Release workflow — triggered on version tags (v*)
# Validates → publishes crates → builds cross-platform binaries → GitHub Release → Docker Hub
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Step 1: Validate ────────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --features aeon-engine/rest-api -- -D warnings
      - run: cargo test --workspace --features aeon-engine/rest-api --lib --exclude samples-e2e-pipeline
      - run: cargo deny check 2>/dev/null || true  # advisory, non-blocking until deny.toml stabilized

  # ── Step 2: Publish to crates.io (tier order) ──────────────────────
  publish-crates:
    name: Publish Crates
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev

      - name: Publish crates (tier order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Tier 1 — no internal deps
          cargo publish -p aeon-types --no-verify
          cargo publish -p aeon-wasm-sdk --no-verify
          sleep 30

          # Tier 2 — depends on aeon-types only
          cargo publish -p aeon-native-sdk --no-verify
          cargo publish -p aeon-processor-client --no-verify
          cargo publish -p aeon-crypto --no-verify
          cargo publish -p aeon-io --no-verify
          cargo publish -p aeon-state --no-verify
          cargo publish -p aeon-wasm --no-verify
          cargo publish -p aeon-observability --no-verify
          cargo publish -p aeon-connectors --no-verify
          cargo publish -p aeon-cluster --no-verify
          sleep 30

          # Tier 3 — depends on Tier 1 + 2
          cargo publish -p aeon-engine --no-verify
          sleep 30

          # Tier 4 — binary crate
          cargo publish -p aeon-cli --no-verify

  # ── Step 3: Build cross-platform binaries ──────────────────────────
  build-binaries:
    name: Build (${{ matrix.target }})
    needs: validate
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: aeon
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: aeon
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: aeon
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: aeon
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: aeon.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation deps (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu cmake libssl-dev
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install system deps (Linux x86_64)
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p aeon-cli

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.artifact }} dist/
          cp LICENSE README.md dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: aeon-${{ matrix.target }}
          path: dist/

  # ── Step 4: Create GitHub Release ──────────────────────────────────
  github-release:
    name: GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Create release archives and checksums
        run: |
          for dir in aeon-*/; do
            target="${dir%/}"
            if [[ "$target" == *windows* ]]; then
              zip -j "${target}.zip" "$dir"/*
              sha256sum "${target}.zip" > "${target}.zip.sha256"
            else
              tar czf "${target}.tar.gz" -C "$dir" .
              sha256sum "${target}.tar.gz" > "${target}.tar.gz.sha256"
            fi
          done

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            aeon-*.tar.gz
            aeon-*.tar.gz.sha256
            aeon-*.zip
            aeon-*.zip.sha256

  # ── Step 5: Publish Docker images ──────────────────────────────────
  publish-docker:
    name: Publish Docker
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            aeonrust/aeon:latest
            aeonrust/aeon:${{ steps.version.outputs.VERSION }}
