name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check + Clippy + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system deps (rdkafka)
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --features aeon-engine/rest-api -- -D warnings

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system deps (rdkafka)
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev

      - name: Run unit tests
        run: |
          cargo test --workspace --features aeon-engine/rest-api --lib \
            --exclude samples-e2e-pipeline

      - name: Run integration tests (no Redpanda)
        run: |
          cargo test -p aeon-engine --features rest-api \
            --test backpressure

  build:
    name: Build Release Binary
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system deps (rdkafka)
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev

      - name: Build release binary
        run: cargo build --release -p aeon-cli

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: aeon-linux-x86_64
          path: target/release/aeon
