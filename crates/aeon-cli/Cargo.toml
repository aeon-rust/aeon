[package]
name = "aeon-cli"
description = "CLI binary entrypoint for Aeon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "aeon"
path = "src/main.rs"

[features]
default = ["native-validate"]
native-validate = ["aeon-engine/native-loader"]

[dependencies]
aeon-types = { workspace = true }
aeon-engine = { workspace = true, optional = true }
anyhow = { workspace = true }
clap = { workspace = true }
wasmtime = { workspace = true }
